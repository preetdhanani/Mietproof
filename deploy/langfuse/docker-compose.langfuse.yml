# Self-hosted Langfuse stack - pinned versions, per-container memory caps
# sized for a 12 GB VM. Included by deploy/docker-compose.prod.yml.
# Traces are ephemeral by policy (retention limits below); the run log in
# the repo is the durable record.
services:
  langfuse-web:
    image: langfuse/langfuse:2.96.1
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_started
      langfuse-minio:
        condition: service_started
      langfuse-worker:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      &langfuse-env
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?set LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3100}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT}
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      REDIS_URL: redis://langfuse-redis:6379
      REDIS_AUTH: ${CLICKHOUSE_PASSWORD}
      S3_ENDPOINT: http://langfuse-minio:9000
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_BUCKET: langfuse
      S3_FORCE_PATH_STYLE: "true"
      TELEMETRY_ENABLED: "false"
      # Trace retention: 14 days (ephemeral by policy)
      LANGFUSE_EVENTS_RETENTION_DAYS: "14"
      LANGFUSE_TRACE_RETENTION_DAYS: "14"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  langfuse-worker:
    image: langfuse/langfuse-worker:2.96.1
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_started
      langfuse-minio:
        condition: service_started
    environment: *langfuse-env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3030/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  langfuse-db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?set LANGFUSE_DB_PASSWORD}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.3
    restart: unless-stopped
    mem_limit: 1500m
    user: "101:101"
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse-clickhouse:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  langfuse-redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 200m
    command: ["redis-server", "--requirepass", "${CLICKHOUSE_PASSWORD}"]
    volumes:
      - langfuse-redis:/data

  langfuse-minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    mem_limit: 400m
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - langfuse-minio:/data

volumes:
  langfuse-postgres:
  langfuse-clickhouse:
  langfuse-clickhouse-logs:
  langfuse-redis:
  langfuse-minio:
