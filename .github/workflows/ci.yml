name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q

  eval-gate:
    # Deterministic eval gate (no LLM) - runs when retrieval, chunking, or
    # prompt code changes. The fixture collection makes this hermetic.
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            retrieval:
              - 'retrieval/**'
              - 'ingestion/**'
              - 'app/prompts/**'
              - 'evals/golden_set.jsonl'
              - 'evals/deterministic.py'
      - name: Deterministic eval gate (fixture collection)
        if: steps.filter.outputs.retrieval == 'true'
        run: |
          uv run python -m evals.run_eval --tier deterministic \
            --collection fixture --no-log
        env:
          EVAL_FIXTURE_COLLECTION: "1"
      - name: Report could-not-run as neutral
        if: steps.filter.outputs.retrieval != 'true'
        run: echo "No retrieval/chunking/prompt changes - eval gate not required"

  stand-diff:
    # Flags golden items whose verification Stand differs from the pinned
    # snapshot; triggered on corpus/eval/env changes.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Stand-diff check
        run: uv run python -m evals.stand_diff
