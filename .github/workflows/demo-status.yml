name: Demo status

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

jobs:
  ping-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the live demo's /health/ready
        id: ping
        continue-on-error: true
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ secrets.DEMO_URL }}/health/ready")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          test "$STATUS" = "200"
      - name: Open a tracking issue on failure
        if: steps.ping.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const status = steps.ping.outputs.status || 'unreachable';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Demo down (health/ready -> ${status})`,
              body: `The weekly demo ping failed with HTTP ${status}.\n\n` +
                    `- Flip the README status badge to "demo offline".\n` +
                    `- Triage with deploy/RUNBOOK.md ("VM unreachable" section).\n` +
                    `- The recorded demo GIF is the primary asset; the live link is secondary.`,
              labels: ['demo-status'],
            });
      - name: Flip the README badge
        if: steps.ping.outcome != 'success'
        run: |
          sed -i 's/badge=live/badge=offline/g' README.md || true
          echo "README badge flip is a manual follow-up if the sed target changed"
